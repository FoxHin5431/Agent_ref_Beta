name: Validator release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt openpyxl
      - run: python -m agent_ref_validator.verify
      - run: python -m unittest discover -s agent_ref_validator/tests -v
      - run: python -m unittest discover -s tests -v
      - run: python tools/smoke_app.py .
